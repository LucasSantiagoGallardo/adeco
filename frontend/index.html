<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gestión de Personal</title>
</head>
<body>
  <h1>Gestión de Personal</h1>
  <section id="employees">
    <h2>Empleados</h2>
    <ul id="employee-list"></ul>
    <h3>Agregar empleado</h3>
    <input id="employee-name" placeholder="Nombre">
    <input id="employee-role" placeholder="Rol">
    <button id="add-employee">Agregar</button>
  </section>
  <section id="hours">
    <h2>Horas</h2>
    <ul id="hours-list"></ul>
    <h3>Registrar horas</h3>
    <input id="hours-employee-id" placeholder="ID empleado">
    <input id="hours-date" type="date">
    <input id="hours-hours" type="number" placeholder="Horas">
    <button id="add-hours">Registrar</button>
  </section>
  <script src="script.js"></script>
</body>
</html>
